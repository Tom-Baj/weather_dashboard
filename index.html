<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>weather-dashboard</title>
   </head>
   <body>
      <section class="hero">
         <div class="logo">
            <div class="logo__icon">
               <img src="assets/icons/weather_icon.webp" alt="weather icon" />
            </div>
            <div class="logo__text"></div>
            <span class="logo__separator"></span>
            <div class="logo__accent"></div>
         </div>

         <div class="search search--large">
            <div class="search__icon"></div>
            <input class="search__input" type="text" />
            <button class="search__button" type="button"></button>
         </div>

         <div class="hero__content">
            <h1 class="hero__title"></h1>
            <p class="hero__subtitle"></p>
         </div>

         <div class="hero__illustration"></div>
      </section>

      <div id="app"></div>
      <script type="module" src="/src/main.js"></script>
   </body>
</html>
