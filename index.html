<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>weather-dashboard</title>
      <link rel="icon" type="image/ico" href="assets/icons/favicon.ico" />
   </head>
   <body>
      <section class="hero">
         <div class="logo">
            <div class="logo__icon">
               <img src="assets/icons/weather_icon.webp" alt="weather icon" />
            </div>
            <div class="logo__text"></div>
            <span class="logo__separator"></span>
            <div class="logo__accent"></div>
         </div>

         <div class="search search--large">
            <div class="search__icon"></div>
            <form class="search__form" action="" method="get">
               <input
                  class="search__input"
                  type="text"
                  placeholder="Rechercher une ville..." />
               <button class="search__button" type="submit"></button>
            </form>
         </div>

         <div class="hero__content">
            <h1 class="hero__title">Le temps commence ici.</h1>
            <p class="hero__subtitle">
               Trouvez les conditions météorologiques les plus précises pour
               votre ville.
            </p>
         </div>

         <div class="hero__illustration"></div>
      </section>

      <div id="app"></div>
      <script type="module" src="/src/main.js"></script>
   </body>
</html>
